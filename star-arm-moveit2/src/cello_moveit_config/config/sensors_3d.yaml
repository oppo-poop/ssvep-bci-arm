# 2026-10-17：停用两路 3D 传感器（本项目没有 Kinect/深度相机，话题本就不存在）。
# 原因：这两个 octomap updater 会实例化 occupancy_map_monitor 的 mesh_filter，
#       而 mesh_filter 需要 GLUT 开窗——无显示环境下 move_group 直接段错误退出。
#       （日志特征：`freeglut failed to open display ''` 紧跟 `process has died ... -11`）
# 恢复条件：接入真实深度相机后，把下面 sensors 列表改回
#   [kinect_pointcloud, kinect_depthimage] 并把 point_cloud_topic / image_topic 指向真实话题，
#   同时确保运行环境有可用显示（或 xvfb-run）。
sensors: []
kinect_pointcloud:
  filtered_cloud_topic: filtered_cloud
  max_range: 5.0
  max_update_rate: 1.0
  padding_offset: 0.1
  padding_scale: 1.0
  point_cloud_topic: /head_mount_kinect/depth_registered/points
  point_subsample: 1
  sensor_plugin: occupancy_map_monitor/PointCloudOctomapUpdater
kinect_depthimage:
  far_clipping_plane_distance: 5.0
  filtered_cloud_topic: filtered_cloud
  image_topic: /head_mount_kinect/depth_registered/image_raw
  max_update_rate: 1.0
  near_clipping_plane_distance: 0.3
  padding_offset: 0.03
  padding_scale: 4.0
  queue_size: 5
  sensor_plugin: occupancy_map_monitor/DepthImageOctomapUpdater
  shadow_threshold: 0.2