# 6 个固定位置（示教值，2026-11-09）
#
# 来源：scripts/teach.py 示教，data/teach_points.json。
# 坐标是 **link6（法兰）** 的世界系位置，单位米 —— 和 roarm_cli.py pose 同一约定，
# 不要再叠加 grasp_offset（那个是「视觉算出的物料点 → link6」用的，固定位置不需要）。
#
# ⚠ 这是**示教值不是标定值**：换物料、挪桌子、换夹爪都要重教。
# ⚠ 托盘三点里 t_blue 的 z 比其他低 19.5 mm，w_green 的 z 比另两个物料高 10 mm，
#    已确认在可接受误差内，未修正。

# ---- z 命令补偿（2026-11-10 实测）----
# 这台臂的 z 落点系统性**低于**命令值，且随高度略变：
#     命令 z=0.060 → 实际 0.0506（−9.4 mm）
#     命令 z=0.200 → 实际 0.1836（−16.4 mm）
#     命令 z=0.350 → 实际 0.3340（−16.0 mm）
# 执行时把 z 加上这个值再发：z_cmd = z_target + 0.014。
# 验算：命令 0.074 → 实际 0.0623（目标 0.060，残余 +2.3 mm）。
# 下面 objects/pads 的 z 是**臂应该到达的真实位置**，不含补偿。
# 换爪/改末端负载后必须重测，别沿用。
# ⚠ 测量时 tol 必须收紧（≤5mm）：判据是"连续 3 次进入容差就返回"，
#   tol 设大了会在运动途中判成功，读到的是半路位置（2026-11-10 踩过）。
z_cmd_offset_m: 0.014

# 物料抓取点：x 沿前后排（350/450/550），y 全为 −280
objects:
  red:   [0.5500, -0.2800, 0.0600]
  green: [0.3500, -0.2800, 0.0700]
  blue:  [0.4500, -0.2800, 0.0600]

# 托盘放置点：都在 x≈560（最远端），y 从 +170 到 −68 斜排
pads:
  red:   [0.5600,  0.1700, 0.0600]
  green: [0.5600,  0.0800, 0.0600]
  blue:  [0.5560, -0.0676, 0.0405]

# 物料尺寸（米）。示教时没记，抓取前必须补：夹爪合拢比例按它算
# （teach.py 的 grip_close = gap_to_frac(物宽 − 2mm)）。
object_height: 0.050
object_width: 0.050

# 张开开度（mm）。取物前套物料、放完后松爪都用它。
# 用**全开 68** 而不是 open_target 的 60：套物料要的是容错，60mm 时单边只剩 5mm，
# 下降稍偏两指就顶在物料侧面（2026-11-10 链神指出）。
# 如果发现爪一直顶在机械极限上发烫，降到 64 —— 对 50mm 物料仍然够。
grip_open_mm: 68.0

# 接近/撤离的竖直偏移（米）。从上方接近，避免贴着桌面横移蹭到别的物料。
standoff: 0.050
