# 6 个固定位置（示教值，2026-11-09）
#
# 来源：scripts/teach.py 示教，data/teach_points.json。
# 坐标是 **link6（法兰）** 的世界系位置，单位米 —— 和 roarm_cli.py pose 同一约定，
# 不要再叠加 grasp_offset（那个是「视觉算出的物料点 → link6」用的，固定位置不需要）。
#
# ⚠ 这是**示教值不是标定值**：换物料、挪桌子、换夹爪都要重教。
# ⚠ 托盘三点里 t_blue 的 z 比其他低 19.5 mm，w_green 的 z 比另两个物料高 10 mm，
#    已确认在可接受误差内，未修正。

# ---- z 命令补偿（2026-11-10 实测）----
# 这台臂的 z 落点系统性**低于**命令值，且随高度略变：
#     命令 z=0.060 → 实际 0.0506（−9.4 mm）
#     命令 z=0.200 → 实际 0.1836（−16.4 mm）
#     命令 z=0.350 → 实际 0.3340（−16.0 mm）
# 执行时把 z 加上这个值再发：z_cmd = z_target + 0.014。
# 验算：命令 0.074 → 实际 0.0623（目标 0.060，残余 +2.3 mm）。
# 下面 objects/pads 的 z 是**臂应该到达的真实位置**，不含补偿。
# 换爪/改末端负载后必须重测，别沿用。
# ⚠ 测量时 tol 必须收紧（≤5mm）：判据是"连续 3 次进入容差就返回"，
#   tol 设大了会在运动途中判成功，读到的是半路位置（2026-11-10 踩过）。
z_cmd_offset_m: 0.014

# 物料抓取点：x 沿前后排（350/450/550），y 全为 −280
objects:
  red:   [0.5500, -0.2800, 0.0600]
  green: [0.3500, -0.2800, 0.0700]
  blue:  [0.4500, -0.2800, 0.0600]

# 托盘放置点：都在 x≈560（最远端），y 从 +170 到 −68 斜排
# 2026-11-10 绿/蓝两个托盘在桌上对调了位置，配置跟着换（坐标是实测值，没重教）。
# 注意 blue 那组 z=0.0405 比另两个低 19.5mm —— 现在落在 green 身上，是那个托盘本身浅。
pads:
  red:   [0.5600,  0.1700, 0.0600]
  green: [0.5560, -0.0676, 0.0405]
  blue:  [0.5600,  0.0800, 0.0600]

# 物料尺寸（米）。**实测物高 7mm**（2026-11-10 链神确认，不是之前写的 50）。
# 合拢比例按物宽算（teach.py 的 grip_close = gap_to_frac(物宽 − 过盈)）。
object_height: 0.007
object_width: 0.050

# 抬起高度（米）。物料只有 7mm 高，抬 30mm 已是它的 4 倍，横移不会蹭。
# ⚠ 这台臂在远端（x≥0.45）z 抬不过 ~0.10（joint2 力矩极限，42.7℃ 是证据），
#   所以别指望"抬到 0.12"：目标是 0.070+0.030=0.100，落在能力边界内。
#   抬起未完全到位**不中止流程** —— 只要高过物料就够横移。
lift: 0.030

# 张开开度（mm）。取物前套物料、放完后松爪都用它。
# 60 mm ≡ `grip 0.9`（teach.py 的比例口径：frac_to_gap_mm(0.9)=59.7）。
# 对 50 mm 物料单边 5 mm 余量，链神 2026-11-10 确认够用。
# 别用 68 全开：只在取/放两个瞬间张到极限没必要，顶久了舵机发烫。
grip_open_mm: 60.0

# 合拢过盈量（mm）：合拢目标 = 物宽 − 这个值。50 mm 物料 → 目标 40 mm。
# ⚠ 不能只给 2 mm。这爪是**位置控制**，被物料挡住时实际停在物宽处，
#   目标离实际越近，舵机使的力越小 —— 差 2 mm 只是"搭着"，一抬就掉。
#   2026-11-10 实测 48 mm 夹不紧，改 10 mm 过盈（目标 40）才有夹持力。
#   代价：夹着的时候一直顶着，别长时间保持（堵转发热）。
grip_close_margin_mm: 10.0

# 抓取高度微调（mm，负=更低）。只作用于 objects，托盘点不动（降了会压托盘底）。
# 2026-11-10 实测：按示教 z 下降时指尖比物料中心高约 4 mm，降 4 才夹到中段。
# 三个物料是同一批同一桌面教的，先统一 -4；若某个点单独偏，改该点的 z。
grasp_dz_mm: -4.0

# 接近/撤离的竖直偏移（米）。从上方接近，避免贴着桌面横移蹭到别的物料。
# 30mm 对 7mm 高的物料是 4 倍余量；再大就超过这台臂的抬升能力（见上面的 lift）。
standoff: 0.030
